<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060D03;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1608;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gradContour" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D4A2B;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#243D0F;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="400" height="400" fill="url(#gradBg)"/>

  <!-- Contornos topográficos circulares (montaña) -->
  <circle cx="200" cy="180" r="150" fill="none" stroke="url(#gradContour)" stroke-width="2" opacity="0.4"/>
  <circle cx="200" cy="180" r="135" fill="none" stroke="#2D4A2B" stroke-width="1.5" opacity="0.5"/>
  <circle cx="200" cy="180" r="120" fill="none" stroke="#2D4A2B" stroke-width="1.5" opacity="0.4"/>
  <circle cx="200" cy="180" r="105" fill="none" stroke="#243D0F" stroke-width="1" opacity="0.6"/>
  <circle cx="200" cy="180" r="90" fill="none" stroke="#243D0F" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="180" r="75" fill="none" stroke="#2D4A2B" stroke-width="1" opacity="0.4"/>
  <circle cx="200" cy="180" r="60" fill="none" stroke="#2D4A2B" stroke-width="1" opacity="0.3"/>
  <circle cx="200" cy="180" r="45" fill="none" stroke="#243D0F" stroke-width="0.8" opacity="0.4"/>
  <circle cx="200" cy="180" r="30" fill="none" stroke="#243D0F" stroke-width="0.8" opacity="0.3"/>

  <!-- Contornos adicionales para efecto 3D -->
  <ellipse cx="200" cy="200" rx="140" ry="80" fill="none" stroke="#2D4A2B" stroke-width="1" opacity="0.3"/>
  <ellipse cx="200" cy="200" rx="110" ry="60" fill="none" stroke="#243D0F" stroke-width="1" opacity="0.2"/>

  <!-- Líneas de elevación diagonales -->
  <path d="M 80 280 Q 200 180 280 280" fill="none" stroke="#2D4A2B" stroke-width="1.5" opacity="0.4"/>
  <path d="M 90 270 Q 200 160 290 270" fill="none" stroke="#2D4A2B" stroke-width="1" opacity="0.3"/>
  <path d="M 70 290 Q 200 200 270 290" fill="none" stroke="#243D0F" stroke-width="1" opacity="0.2"/>

  <!-- Pico central (Peñolite) - Dorado -->
  <circle cx="200" cy="180" r="20" fill="#C8961E" opacity="0.8"/>
  <circle cx="200" cy="180" r="16" fill="#FFD700" opacity="0.4"/>
  <circle cx="200" cy="180" r="12" fill="#C8961E" opacity="0.3"/>

  <!-- Etiqueta "PEÑOLITE" -->
  <text x="200" y="350" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#C8961E" text-anchor="middle" opacity="0.9">
    PEÑOLITE
  </text>

  <!-- Etiqueta "Sierra de Segura" -->
  <text x="200" y="25" font-family="Arial, sans-serif" font-size="12" fill="#2D4A2B" text-anchor="middle" opacity="0.6" letter-spacing="2">
    SIERRA DE SEGURA
  </text>

  <!-- Altitud indicador -->
  <text x="320" y="100" font-family="Arial, sans-serif" font-size="11" fill="#C8961E" opacity="0.7">
    840m
  </text>

  <!-- Línea de referencia de altitud -->
  <line x1="300" y1="95" x2="340" y2="95" stroke="#C8961E" stroke-width="1" opacity="0.5"/>

  <!-- Decoración: puntos de referencia -->
  <circle cx="140" cy="240" r="3" fill="#2D4A2B" opacity="0.5"/>
  <circle cx="260" cy="260" r="3" fill="#2D4A2B" opacity="0.5"/>
  <circle cx="120" cy="160" r="3" fill="#2D4A2B" opacity="0.4"/>
  <circle cx="280" cy="140" r="3" fill="#2D4A2B" opacity="0.4"/>

  <!-- Efecto de sombra/profundidad -->
  <ellipse cx="200" cy="300" rx="180" ry="40" fill="#000000" opacity="0.1"/>
</svg>